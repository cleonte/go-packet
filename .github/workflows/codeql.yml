# Code scanning. macOS runner because the code is darwin-only (cgo + CoreWLAN); free on public repos.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
