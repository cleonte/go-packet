# macOS is required (CoreWLAN, Network.framework). Public repos get free runner minutes;
# if this repo ever goes private, macOS minutes are billed at 10x, so keep the job thin.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build

      # Known vulnerabilities in the dependencies and the standard library actually used.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false
          go-package: ./...

      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
          version: latest
